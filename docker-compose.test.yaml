# Spin up Postgres + MariaDB containers for chunkshop integration tests.
#
# Usage:
#   docker compose -f docker-compose.test.yaml up -d
#   export CHUNKSHOP_TEST_DSN="postgresql://postgres:postgres@localhost:5434/chunkshop_test"
#   export CHUNKSHOP_TEST_DSN_MARIADB="mysql://root:rootpw@localhost:3307/chunkshop_test"
#   uv run pytest -q
#   docker compose -f docker-compose.test.yaml down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chunkshop_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:11.7
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: chunkshop_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: chpw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: chunkshop_test
    ports:
      - "8124:8123"   # HTTP (clickhouse-connect default)
      - "9001:9000"   # Native TCP
    volumes:
      # Enable the experimental vector_similarity index (CH 24.10+).
      # Read-write because the entrypoint writes default-user.xml here.
      - ./.docker/clickhouse-config:/etc/clickhouse-server/users.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u default --password chpw -q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
