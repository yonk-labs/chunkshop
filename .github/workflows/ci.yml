name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + scenarios (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # Databases are brought up from docker-compose.test.yaml (a "Start test
    # databases" step below) rather than GHA `services:` blocks. That file is
    # the single source of truth for service images, ports, healthchecks, and
    # — critically — the ClickHouse users.d mount that enables the
    # experimental vector_similarity index. Re-deriving these as `services:`
    # blocks would drift from the canonical local-dev definitions.

    env:
      # Ports/credentials match docker-compose.test.yaml. All three DSNs are
      # set so the modular-backend integration tests (MariaDB / SQLite /
      # ClickHouse) and the cross-backend matrix run instead of skipping.
      CHUNKSHOP_TEST_DSN: postgresql://postgres:postgres@localhost:5434/chunkshop_test
      CHUNKSHOP_TEST_DSN_MARIADB: mysql://root:rootpw@localhost:3307/chunkshop_test
      CHUNKSHOP_TEST_DSN_CH: clickhouse://default:chpw@localhost:8124/chunkshop_test
      # Pin fastembed cache to a path we can persist across runs.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Cache fastembed models
        uses: actions/cache@v5
        with:
          path: .cache/fastembed
          # Bust cache when the embedder registry changes — that's the
          # thing that dictates which ONNX files we pull.
          key: fastembed-${{ runner.os }}-${{ hashFiles('python/src/chunkshop/embedders/_registry.py') }}
          restore-keys: |
            fastembed-${{ runner.os }}-

      - name: Start test databases (Postgres + MariaDB + ClickHouse)
        # Reuses the canonical compose file so service config can't drift from
        # local dev. --wait blocks until every service's healthcheck passes.
        run: docker compose -f docker-compose.test.yaml up -d --wait

      - name: Install project + dev + nlp + lede + lede-spacy + all-backends + code + all-parsers
        working-directory: python
        # --frozen installs strictly from the committed lockfile and refuses
        # to update it. Catches "I forgot to commit uv.lock after adding a
        # dep" before it merges. all-backends pulls pymysql /
        # clickhouse-connect / sqlite-vec so the modular-backend test modules
        # import (they fail at *collection* otherwise). lede + lede-spacy
        # provide the query-hint/summary feature the search tests exercise
        # (they import chunkshop.summarizers.lede directly and have no
        # skip-guard; without lede-spacy the spaCy-backed hint expansion
        # tests skip instead of running). code pulls tree-sitter +
        # tree-sitter-python + tree-sitter-java for the SP-A codeparse
        # surface (symbol_aware chunker, code_relationships extractor).
        # all-parsers pulls pypdf / python-docx / python-pptx / openpyxl /
        # beautifulsoup4 so the SP-3 file-parser tests run instead of
        # importorskip-ing.
        run: uv sync --frozen --extra dev --extra extractors --extra nlp --extra all-backends --extra lede --extra lede-spacy --extra code --extra all-parsers

      - name: Install spaCy English model (for lede-spacy hint-expansion tests)
        working-directory: python
        # The 6 lede-report / cli-search summary tests need en_core_web_sm
        # at runtime. lede-spacy gates on its presence — without this step
        # those tests skip-not-fail. The download is ~12 MB.
        run: uv run --no-sync python -m spacy download en_core_web_sm

      - name: Install chunkshop-connectors (plugin package) + its test deps
        working-directory: python/connectors
        # The plugin package isn't in the core chunkshop test suite; it has
        # its own pytest tree (verified-tier connectors + experimental stubs
        # + chunker-x-extractor matrix + e2e demos). Its [dev] extra includes
        # beautifulsoup4 / sqlite-vec / httpx / pytest_httpserver / rake-nltk
        # so the url-crawl + sqlite + httpx-mock + rake-extractor cells run
        # instead of importorskip-ing. Editable install resolves chunkshop
        # from the sibling python/ checkout (see [tool.uv.sources]).
        run: uv sync --extra dev

      - name: Verify pgvector extension available
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d chunkshop_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname='vector';"

      - name: pytest (core chunkshop — unit + integration)
        working-directory: python
        run: uv run pytest -q --tb=short

      - name: pytest (chunkshop-connectors plugin suite)
        working-directory: python/connectors
        # Connectors run their own suite — verified-tier connector tests,
        # experimental-tier smoke tests, chunker-x-extractor orthogonality
        # matrix, attribution audit. Slow marker excluded by default (those
        # are the live-network e2e demos); add `-m slow` locally to run them.
        run: uv run --no-sync --project . pytest -q --tb=short

      - name: Run functional scenarios (tests/sub)
        run: bash tests/sub/run-all.sh

      - name: Assert functional scenario row counts
        run: uv run --project python python tests/sub/assert-row-counts.py

      - name: Run use-case scenarios (tests/use-cases)
        run: bash tests/use-cases/run-all.sh

      - name: Assert use-case scenario row counts
        run: uv run --project python python tests/use-cases/assert-row-counts.py

      - name: Tear down test databases
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v
