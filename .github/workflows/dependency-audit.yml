name: Dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Export locked Python requirements
        working-directory: python
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            --output-file /tmp/chunkshop-pip-audit.txt

      - name: Run pip-audit
        working-directory: python
        run: |
          uv run --with pip-audit pip-audit \
            -r /tmp/chunkshop-pip-audit.txt \
            --no-deps \
            --disable-pip \
            --skip-editable \
            --ignore-vuln CVE-2025-3000
          # CVE-2025-3000: torch 2.11.0 — NO fixed version published as of this
          # release. torch is an optional/transitive dep (sentence-transformers
          # via the [keybert]/[nlp] extras) used only for trusted HF-model
          # inference; low exploitability for chunkshop's use. Mirrors the
          # cargo-audit RUSTSEC-2023-0071/2024-0436 ignores (no-fix advisories).
          # Remove once torch ships a patched release.

  rust:
    name: cargo audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-audit-${{ runner.os }}-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo audit
        working-directory: rust
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

          # RUSTSEC-2023-0071: rsa 0.9.10 via sqlx-mysql. No fixed upgrade is
          # available; Chunkshop documents the MariaDB mitigation in
          # docs/engines/mariadb.md and recommends TLS/trusted network path or
          # mysql_native_password so the RSA auth path is not exercised.
          #
          # RUSTSEC-2024-0436: paste 1.0.15 unmaintained warning via
          # tokenizers/fastembed/clickhouse transitive trees. Waived until
          # upstreams remove or replace it.
          #
          # RUSTSEC-2026-0194/0195: quick-xml 0.37.5 XML-parsing DoS, reachable
          # ONLY transitively via object_store 0.11 for parsing S3 ListBucket
          # responses. The fix is quick-xml 0.38, which requires an object_store
          # 0.11 -> 0.14 major bump (aws-feature API changes). Low practical risk
          # (operator controls the S3 endpoint); waived pending a tracked
          # object_store upgrade. anyhow (RUSTSEC-2026-0190) and crossbeam-epoch
          # (RUSTSEC-2026-0204) were fixed by in-range bumps in this same change.
