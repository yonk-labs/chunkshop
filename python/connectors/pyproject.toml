[project]
name = "chunkshop-connectors"
version = "0.1.0"
description = "First-party connector plugins for chunkshop (RAGFlow/Onyx MIT lift)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "The Yonk", email = "matt@theyonk.com" }]
keywords = ["chunkshop", "connectors", "rag", "data-ingest", "onyx", "ragflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "chunkshop>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest_httpserver>=1.0",
    # Required so the URL-crawl e2e tests (chunkshop core's depth-bounded
    # HttpSource crawler) actually exercise the bs4-backed link extraction
    # path instead of silently `pytest.importorskip`-skipping on a clean CI.
    "beautifulsoup4>=4.12",
    # Required so the sqlite-backed e2e tests exercise the vector path
    # instead of silently skipping when the sqlite-vec runtime isn't loaded.
    "sqlite-vec>=0.1.3",
    # Used by URL-crawl, github, and gdrive tests via httpx.MockTransport
    # (already pulled transitively today, but the test path depends on it
    # directly — declare it here for CI determinism).
    "httpx>=0.26",
    # Exercises the chunker-x-extractor matrix in CI — without these the
    # rake_keywords cells skip via importorskip and the cross-connector
    # orthogonality only gets the NoneExtractor lane.
    "rake-nltk>=1.0",
    "nltk>=3.8",
]
gdrive = ["httpx>=0.26"]
github = ["httpx>=0.26"]
slack = ["httpx>=0.26"]
blob = ["boto3>=1.28"]
rss = ["feedparser>=6.0"]
notion = []
confluence = []
jira = []
dropbox = []
box = []
gitlab = []
bitbucket = []
gmail = []
imap = []
discord = []
airtable = []
asana = []
zendesk = []
sharepoint = []
teams = []
seafile = []
webdav = []
moodle = []
dingtalk = []
rest_api = []
all = [
    "chunkshop-connectors[gdrive,github,slack,blob,rss,notion,confluence,jira,dropbox,box,gitlab,bitbucket,gmail,imap,discord,airtable,asana,zendesk,sharepoint,teams,seafile,webdav,moodle,dingtalk,rest_api]",
]

# Connector plugins register source types under the "chunkshop.sources"
# entry-point group. Each connector adds one line below as it lands; see
# docs/cookbook/authoring-connectors.md in the chunkshop core repo.
[project.entry-points."chunkshop.sources"]
# Verified tier — behaviourally tested with hermetic mocks.
blob = "chunkshop_connectors.blob:factory"
rss = "chunkshop_connectors.rss:factory"
github = "chunkshop_connectors.github:factory"
gdrive = "chunkshop_connectors.gdrive:factory"
slack = "chunkshop_connectors.slack:factory"
# Experimental tier — registered as stubs (raise StubError on iter);
# real implementations land in follow-ups. See docs/connectors/_status.md.
notion = "chunkshop_connectors.notion:factory"
confluence = "chunkshop_connectors.confluence:factory"
jira = "chunkshop_connectors.jira:factory"
dropbox = "chunkshop_connectors.dropbox:factory"
box = "chunkshop_connectors.box:factory"
gitlab = "chunkshop_connectors.gitlab:factory"
bitbucket = "chunkshop_connectors.bitbucket:factory"
gmail = "chunkshop_connectors.gmail:factory"
imap = "chunkshop_connectors.imap:factory"
discord = "chunkshop_connectors.discord:factory"
airtable = "chunkshop_connectors.airtable:factory"
asana = "chunkshop_connectors.asana:factory"
zendesk = "chunkshop_connectors.zendesk:factory"
sharepoint = "chunkshop_connectors.sharepoint:factory"
teams = "chunkshop_connectors.teams:factory"
r2 = "chunkshop_connectors.r2:factory"
gcs = "chunkshop_connectors.gcs:factory"
oci = "chunkshop_connectors.oci:factory"
seafile = "chunkshop_connectors.seafile:factory"
webdav = "chunkshop_connectors.webdav:factory"
moodle = "chunkshop_connectors.moodle:factory"
dingtalk = "chunkshop_connectors.dingtalk:factory"
rest_api = "chunkshop_connectors.rest_api:factory"

[project.urls]
Homepage = "https://github.com/yonk-labs/chunkshop"
Issues = "https://github.com/yonk-labs/chunkshop/issues"
Repository = "https://github.com/yonk-labs/chunkshop.git"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that require live infrastructure (Postgres, ClickHouse, model loads) and are skipped on plain `pytest`. Run with `-m slow` or `-m 'slow or not slow'` to include.",
]

# Resolve chunkshop from the sibling in-repo path so editable installs of
# this plugin always pick up the current main chunkshop, not PyPI. When
# building a wheel for PyPI publication, this section is ignored by the
# build backend.
[tool.uv.sources]
chunkshop = { path = "..", editable = true }
