[project]
name = "chunkshop"
version = "0.9.1"
description = "Standalone ingest-to-pgvector: source → chunker → embedder → extractor → table. int8 by default."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "The Yonk", email = "matt@theyonk.com" }]
keywords = ["rag", "pgvector", "embeddings", "chunking", "ingest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "fastembed>=0.3",
]

[project.optional-dependencies]
extractors = ["rake-nltk>=1.0.6", "nltk>=3.8"]
keybert = ["keybert>=0.8", "sentence-transformers>=3.0"]
spacy = ["spacy>=3.7"]
lang = ["langdetect>=1.0.9"]
nlp = ["keybert>=0.8", "sentence-transformers>=3.0", "spacy>=3.7", "langdetect>=1.0.9"]
quantize = ["onnx>=1.14"]
lede = ["lede>=0.4.5"]
lede-spacy = ["lede-spacy>=0.4.5"]
sumy = ["sumy>=0.11"]
summarize = []  # umbrella — users pick [lede] and/or [sumy] explicitly
s3 = ["boto3>=1.28"]
sqlite = ["sqlite-vec>=0.1.6"]
mariadb = ["PyMySQL>=1.1"]
clickhouse = ["clickhouse-connect>=0.7"]
all-backends = ["chunkshop[sqlite,mariadb,clickhouse]"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=0.6.23"]
xlsx = ["openpyxl>=3.1"]
html = ["beautifulsoup4>=4.12"]
office = ["chunkshop[pdf,docx,pptx,xlsx]"]
all-parsers = ["chunkshop[pdf,docx,pptx,xlsx,html]"]
# Symbol-aware code parsing (SP-A foundation). Ships tree-sitter grammars
# for every language chunkshop's codeparse layer recognises: Python, Java,
# Go, TypeScript, JavaScript, Rust, C, C++, C#, Ruby. The regex fallback in
# regex_fallback.py stays as the safety net (used when this extra isn't
# installed, or when a grammar raises), but with the extra installed every
# language uses a real parser — no more lossy regex (see chunkshop#40).
code = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "onnx>=1.14"]

[project.scripts]
chunkshop = "chunkshop.cli:cli"

# Connector plugins register source types under the "chunkshop.sources"
# entry-point group. chunkshop core ships NONE; install a plugin (e.g.
# chunkshop-connectors) to add sources. An entry-point value is a factory
# callable with signature (config: dict) -> Source. See
# docs/cookbook/authoring-connectors.md.
#
# Example (in the PLUGIN package's pyproject.toml, not here):
# [project.entry-points."chunkshop.sources"]
# gdrive = "chunkshop_connectors.gdrive:factory"
#
# The S3 RawStore backend (raw_store: type: s3) requires the [s3] extra.

[project.urls]
Homepage = "https://github.com/yonk-labs/chunkshop"
Issues = "https://github.com/yonk-labs/chunkshop/issues"
Repository = "https://github.com/yonk-labs/chunkshop.git"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models or run long benchmarks",
]
