# Per-document hint-biased summary_embed: hints come from each document's
# metadata field `lede_hints` (overriding any static kwargs.hints).
# NOTE: requires the hints_from_meta config field (added in a later task);
# this file will fail `chunkshop validate` until that lands. That is expected.
cell_name: samples_summary_embed_hints_perdoc
source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem
chunker:
  type: summary_embed
  base:
    type: hierarchy
  summarizer:
    mode: callable
    module: chunkshop.summarizers.lede
    function: summarize
    kwargs:
      max_length: 400
      hint_focus: 0.7
      hint_mode: soft
    hints_from_meta: lede_hints
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
target:
  type: postgres
  dsn_env: CHUNKSHOP_DSN
  database: chunkshop_samples
  table: summary_embed_hints_perdoc
  mode: create_if_missing
  source_tag: hints_perdoc
  hnsw: false
