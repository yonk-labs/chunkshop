# Alternative recipe: paragraph-respecting splitter, fp32 embedder.
# Same source, same target schema, different table so you can compare side-by-side.
#
# Run with:
#   chunkshop ingest --config docs/samples/sample-sentence-aware.yaml
#
# NOTE: this config uses the legacy `overwrite: true` field (still honored). For the new
# schema-flex shape — `mode` / `source_tag` / `promote_metadata` — see
# docs/samples/sample-multi-source.yaml or docs/tutorial-multi-source.md.
cell_name: samples_sentence_aware_fp32

source:
  type: files
  glob: docs/samples/*.md
  id_from: stem
  encoding: utf-8

chunker:
  type: sentence_aware
  doc_type: prose

embedder:
  type: fastembed
  model_name: BAAI/bge-small-en-v1.5
  dim: 384
  threads: 4
  batch_size: 64

extractor:
  type: none

target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_samples
  table: handbook_sentence_aware
  overwrite: true
  hnsw: false

runtime:
  omp_num_threads: 4
  heartbeat_every: 5
