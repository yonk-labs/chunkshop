cell_name: samples_hierarchical
source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem
chunker:
  type: hierarchical_summary
  base:
    type: hierarchy
  summarizer:
    mode: callable
    module: chunkshop.summarizers.sumy
    function: summarize
    kwargs:
      algorithm: lex_rank
      sentences_count: 2
  grouping:
    strategy: section_aware
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_samples
  table: hierarchical
  mode: create_if_missing
  source_tag: hierarchical_demo
  promote_metadata:
    - path: granularity
      type: text
    - path: group_id
      type: text
  hnsw: false
