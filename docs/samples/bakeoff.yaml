# Multi-backend bakeoff against docs/samples/*-*.md (4 handbook/release-notes docs).
# Usage:
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5434/age_bakeoff_pgrg
#   export MARIADB_DSN=mysql://root:rootpw@localhost:3307/mysql
#   export SQLITE_BAKEOFF_PATH=/tmp/chunkshop-bakeoff-samples.db
#   chunkshop bakeoff --config docs/samples/bakeoff.yaml
#
# 3 embedders × 2 chunkers × 3 backends = 18 cells. Each cell ingests all 4
# docs into its own table; the report shows side-by-side per-backend metrics.

name: samples_bakeoff

source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem

framer:
  type: identity

gold_queries: docs/samples/bakeoff-gold.yaml

matrix:
  embedders:
    - {type: fastembed, model_name: Xenova/bge-small-en-v1.5-int8, dim: 384}
    - {type: fastembed, model_name: Xenova/bge-base-en-v1.5-int8, dim: 768}
    - {type: fastembed, model_name: nomic-ai/nomic-embed-text-v1.5-Q, dim: 768}
  chunkers:
    - {type: hierarchy}
    - {type: sentence_aware}

targets:
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_samples_pg
  - type: mariadb
    dsn_env: MARIADB_DSN
    database: chunkshop_bakeoff_samples_md
  - type: sqlite
    dsn_env: SQLITE_BAKEOFF_PATH
    database: ignored

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
