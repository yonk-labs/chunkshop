# Runnable bakeoff config against docs/samples/*-*.md (4 handbook/release-notes docs).
# Usage:
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5434/age_bakeoff_pgrg
#   chunkshop bakeoff --config docs/samples/bakeoff.yaml
#
# 3 embedders x 2 chunkers = 6 combos. Each combo ingests all 4 docs into its
# own table under the `chunkshop_bakeoff_samples` schema, then ranks against
# the 14 gold queries in bakeoff-gold.yaml.

name: samples_bakeoff

source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem

framer:
  type: identity

gold_queries: docs/samples/bakeoff-gold.yaml

matrix:
  embedders:
    - {type: fastembed, model_name: Xenova/bge-small-en-v1.5-int8, dim: 384}
    - {type: fastembed, model_name: Xenova/bge-base-en-v1.5-int8, dim: 768}
    - {type: fastembed, model_name: nomic-ai/nomic-embed-text-v1.5-Q, dim: 768}
  chunkers:
    - {type: hierarchy}
    - {type: sentence_aware}

target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_bakeoff_samples

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
