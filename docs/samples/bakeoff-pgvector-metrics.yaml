# Postgres pgvector metric bakeoff against docs/samples/*-*.md.
# Usage:
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5434/age_bakeoff_pgrg
#   chunkshop bakeoff --config docs/samples/bakeoff-pgvector-metrics.yaml --yes
#
# 1 embedder x 4 chunkers x 3 Postgres metric targets = 12 cells. The report
# labels the targets as postgres_cosine, postgres_inner_product, and postgres_l2.

name: pgvector_metric_bakeoff

source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem

framer:
  type: identity

gold_queries: docs/samples/bakeoff-gold.yaml

matrix:
  embedders:
    - {type: fastembed, model_name: BAAI/bge-small-en-v1.5, dim: 384}
  chunkers:
    - {type: hierarchy}
    - {type: sentence_aware}
    - {type: fixed_overlap}
    - {type: neighbor_expand, base: {type: hierarchy}, window: 1}

targets:
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_pgvector_metrics
    vector_metric: cosine
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_pgvector_metrics
    vector_metric: inner_product
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_pgvector_metrics
    vector_metric: l2

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 10
