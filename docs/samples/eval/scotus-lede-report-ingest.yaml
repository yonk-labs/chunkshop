# SCOTUS ingest profile for retrieval-side fact/report experiments.
#
# This uses only Chunkshop + lede. It does not consume pg-raggraph caches or
# extraction outputs; pg-raggraph is only the raw markdown corpus location.
#
# Smoke:
#   cd python
#   CHUNKSHOP_TEST_DSN=postgresql://postgres:postgres@localhost:5434/chunkshop_test \
#     uv run chunkshop ingest --config ../docs/samples/eval/scotus-lede-report-ingest.yaml --doc-limit 5
#
# Full:
#   cd python
#   CHUNKSHOP_TEST_DSN=postgresql://postgres:postgres@localhost:5434/chunkshop_test \
#     uv run chunkshop ingest --config ../docs/samples/eval/scotus-lede-report-ingest.yaml
cell_name: scotus_lede_report
source:
  type: files
  glob: /home/yonk/yonk-tools/pg-raggraph/benchmarks/scotus/*.md
  id_from: stem
chunker:
  type: hierarchy
embedder:
  type: fastembed
  model_name: BAAI/bge-small-en-v1.5
  dim: 384
  threads: 4
extractor:
  type: lede_report
  max_chars: 4000
  max_facts: 40
  backend: regex
  keep_headings: true
  include_toc: true
target:
  type: postgres
  dsn_env: CHUNKSHOP_TEST_DSN
  database: chunkshop_lede_report_scotus
  table: chunks
  mode: overwrite
  hnsw: true
  vector_metric: cosine
  promote_metadata:
    - { path: lede_report.attributes.term.value, type: text }
    - { path: lede_report.attributes.docket_number.value, type: text }
    - { path: lede_report.attributes.citation.value, type: text }
  fts:
    enabled: true
    language: english
    include_metadata_paths:
      - lede_report.search_text
runtime:
  omp_num_threads: 4
  heartbeat_every: 25
