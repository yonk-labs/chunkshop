# A/B-ready single-cell ingest for bakeoff-scotus.
#
# Produces ONE pgvector table containing:
#   - episode chunks (kind='episode') — the prose-leg input (naive vector baseline)
#     reads from rows where metadata->>'kind' IS DISTINCT FROM 'fact'
#   - fact rows (kind='fact') with subject/predicate/object/support_span/confidence
#     from the bundled lede_spacy consolidator
#   - metadata['cooccur'] edges (Tier-1) on every chunk row via the cooccurrence
#     extractor
#
# Consumed by:
#   - pg-raggraph's A/B runner — naive leg filters out kind='fact', graph leg
#     reads fact rows + cooccur edges and resolves entities
#   - chunkshop's sanity test at python/tests/chunkshop/test_ab_gate_emission.py
#
# Contract reference:
#   docs/superpowers/specs/2026-05-28-chunkshop-to-pg-raggraph-emission-contract.md
#
# Mission brief:
#   skill-output/mission-brief/Mission-Brief-ab-gate-graph-vs-naive.md
#
# Prereqs:
#   - lede + lede-spacy extras installed:
#       uv sync --extra dev --extra lede --extra lede-spacy --extra extractors
#       uv run --no-sync python -m spacy download en_core_web_sm
#   - Test PG running: docker compose -f docker-compose.test.yaml up -d
#   - export CHUNKSHOP_TEST_DSN=postgresql://postgres:postgres@localhost:5434/chunkshop_test
#
# Usage (from python/):
#   uv run --no-sync chunkshop ingest --config ../docs/samples/bakeoff-scotus/bakeoff-scotus-ab.yaml
#
# Cleanup:
#   psql "$CHUNKSHOP_TEST_DSN" -c "DROP TABLE IF EXISTS scotus_ab CASCADE;"

cell_name: scotus_ab_gate

source:
  type: json_corpus
  path: /home/yonk/yonk-tools/pg-raggraph/benchmarks/age-bakeoff/src/age_bakeoff/extraction/data/scotus.json
  documents_key: documents
  id_field: id
  content_field: content
  title_field: title

# Consolidation wraps a base prose chunker and adds kind='fact' rows from the
# bundled lede_spacy SVO extractor. The episode chunks carry the prose-leg
# embedding; fact chunks carry the support_span as embedded_content.
chunker:
  type: consolidation
  base:
    type: hierarchy
    prefix_heading: true
    min_section_chars: 100
  consolidator:
    mode: lede_spacy
    confidence_floor: 0.0       # keep all facts; the contract notes nulls are coerced to 0.0 (consolidator.py:71-78)
    max_facts: 20               # default; cap per-episode fact emission
    model: en_core_web_sm       # default spaCy small model
  fact_max_chars: 1200          # default; matches contract §1.2 support_span cap

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
  batch_size: 64

# Cooccurrence extractor (Tier-1) — RAKE-derived keyphrases + co-occurrence
# edges per chunk. Edges land in metadata['cooccur'] with a<b alphabetical
# invariant and (-weight, a, b) sort order (see contract §2).
extractor:
  type: cooccurrence
  top_k: 15
  min_chars: 3
  max_summary_chars: 1000
  min_pair_count: 1

target:
  type: postgres
  dsn_env: CHUNKSHOP_TEST_DSN
  database: chunkshop_test       # the database in the test DSN
  table: scotus_ab
  mode: overwrite
  force_overwrite: true          # this table is owned by the A/B gate; safe to drop
  hnsw: false                    # 772 docs is small enough that seq scan is fine

runtime:
  omp_num_threads: 4
  heartbeat_every: 20
  log_path: /tmp/chunkshop-scotus-ab.log
