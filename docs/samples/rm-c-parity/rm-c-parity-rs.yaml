# Rust-side ingest for RM-C cross-port E2E parity test (SC-004).
# Consumed by python/tests/chunkshop/test_rm_c_e2e_parity.py.
# Identical to rm-c-parity-py.yaml except for cell_name, table, log_path.

cell_name: rm_c_parity_rs

source:
  type: files
  glob: python/tests/fixtures/rm-c-parity/*
  id_from: stem

chunker:
  type: symbol_aware

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4

extractor:
  type: none

target:
  type: postgres
  dsn_env: CHUNKSHOP_TEST_DSN
  database: chunkshop_test
  table: rm_c_rs
  mode: overwrite
  force_overwrite: true
  hnsw: false

runtime:
  omp_num_threads: 2
  log_path: /tmp/chunkshop-rm-c-rs.log
