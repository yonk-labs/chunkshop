cell_name: samples_summary_embed
source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem
chunker:
  type: summary_embed
  base:
    type: hierarchy
  summarizer:
    mode: callable
    module: chunkshop.summarizers.lede
    function: summarize
    kwargs:
      max_length: 300
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_samples
  table: summary_embed
  mode: create_if_missing
  source_tag: summary_demo
  hnsw: false
