# Rust-compatible variant of bakeoff-ntsb.yaml.
#
# Same corpus, same gold queries, same chunkers. The matrix drops the
# nomic embedder because the Rust port's embedder registry doesn't map
# `nomic-ai/nomic-embed-text-v1.5-Q` to a fastembed-rs variant today
# (only the two Xenova int8 BGE variants are bit-exact registered, plus
# the BAAI / all-MiniLM stock fastembed-rs models). Adding nomic to the
# Rust registry is a follow-up brief.
#
# Use this YAML to run the bakeoff from Rust:
#   chunkshop-rs bakeoff --config docs/samples/bakeoff-ntsb/bakeoff-ntsb-rust.yaml \
#                        --dsn "$CHUNKSHOP_DSN" --yes
#
# Use the Python YAML (`bakeoff-ntsb.yaml`) when you want the full matrix
# including nomic. Both YAMLs target the SAME schema and the same combo
# table-name derivation, so a Python run and a Rust run write to the same
# tables — that's by design, and what the cross-language parity test
# (scripts/parity_check_bakeoff.py) leans on.

name: ntsb_bakeoff

source:
  type: files
  glob: /home/yonk/yonk-tools/pg-raggraph/benchmarks/kg-rag-eval/extracted/ntsb/*.md
  id_from: stem

framer:
  type: identity

gold_queries: docs/samples/bakeoff-ntsb/gold-ntsb.yaml

matrix:
  embedders:
    - { type: fastembed, model_name: "Xenova/bge-small-en-v1.5-int8", dim: 384 }
    - { type: fastembed, model_name: "Xenova/bge-base-en-v1.5-int8",  dim: 768 }
  chunkers:
    - { type: hierarchy }
    - { type: sentence_aware }
    - { type: fixed_overlap }
    - { type: neighbor_expand, base: { type: hierarchy }, window: 1 }

target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_bakeoff_ntsb

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
