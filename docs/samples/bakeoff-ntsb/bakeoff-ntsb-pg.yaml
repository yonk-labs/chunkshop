# Postgres-only bakeoff against the NTSB aviation-accident corpus (20
# final-report markdown files). Same corpus and gold set as bakeoff-ntsb.yaml,
# but one backend, so the only thing you need is CHUNKSHOP_DSN.
#
# Matrix size: 4 chunkers x 3 embedders x 1 backend = 12 cells. Results land in
# `skill-output/bakeoff/ntsb_bakeoff/` (results.json + report.md +
# recommended.yaml). The CLI does NOT clean up schemas after the run; drop
# `chunkshop_bakeoff_ntsb_pg` yourself before re-running.
#
# Usage (from the repo root):
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5432/postgres
#   chunkshop bakeoff --config docs/samples/bakeoff-ntsb/bakeoff-ntsb-pg.yaml --yes
#
# The full 63-cell, four-backend matrix is bakeoff-ntsb.yaml (needs
# MARIADB_DSN, SQLITE_BAKEOFF_PATH and CLICKHOUSE_DSN as well).

name: ntsb_bakeoff

source:
  type: files
  glob: docs/samples/bakeoff-ntsb/corpus/*.md
  id_from: stem      # doc_id = file stem (e.g. "20080109X00035")

framer:
  type: identity

gold_queries: docs/samples/bakeoff-ntsb/gold-ntsb.yaml

matrix:
  embedders:
    - { type: fastembed, model_name: "Xenova/bge-small-en-v1.5-int8", dim: 384 }
    - { type: fastembed, model_name: "Xenova/bge-base-en-v1.5-int8",  dim: 768 }
    - { type: fastembed, model_name: "nomic-ai/nomic-embed-text-v1.5-Q", dim: 768 }
  chunkers:
    - { type: hierarchy }
    - { type: sentence_aware }
    - { type: fixed_overlap }
    - { type: neighbor_expand, base: { type: hierarchy }, window: 1 }

targets:
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_ntsb_pg

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
