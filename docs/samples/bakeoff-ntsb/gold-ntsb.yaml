# 12 hand-written gold queries against the NTSB aviation-accident corpus.
# Each entry pairs a user-plausible question with the doc that should rank #1.
#
# Doc IDs are file stems from
# docs/samples/bakeoff-ntsb/corpus/<id>.md
#
# Statistical-power note: 12 queries is a low floor. One query flipping
# moves aggregate recall@1 by ~0.08. Add more queries before treating the
# leaderboard like a tournament result.

# 20071229X02007 — Tallahassee, FL — 85-year-old pilot, Piper PA-22, struck trees on private turf strip
- { query: "elderly pilot accident on private grass airstrip with trees and utility wires", gold_doc_id: "20071229X02007" }
- { query: "Piper PA-22 final approach short turf runway tree strike", gold_doc_id: "20071229X02007" }

