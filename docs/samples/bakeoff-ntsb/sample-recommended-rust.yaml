# NOTE: Top combo from bakeoff 'ntsb_bakeoff' (MRR=0.958, r@1=0.917). Point `source` at your real corpus before running `chunkshop ingest`.
cell_name: ntsb_bakeoff_recommended
chunker:
  doc_type: prose
  max_chars: 2000
  min_chars: 200
  type: sentence_aware
embedder:
  batch_size: 64
  dim: 768
  model_name: nomic-ai/nomic-embed-text-v1.5-Q
  type: fastembed
framer:
  type: identity
source:
  encoding: utf-8
  glob: docs/samples/bakeoff-ntsb/corpus/*.md
  id_from: stem
  type: files
target:
  type: postgres
  dsn_env: CHUNKSHOP_DSN
  mode: overwrite
  database: chunkshop_bakeoff_ntsb
  table: ntsb_bakeoff_production
