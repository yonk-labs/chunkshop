# Bakeoff against the NTSB aviation-accident corpus shipped with pg-raggraph's
# kg-rag-eval benchmark (20 final-report markdown files).
#
# Each combo (chunker x embedder) ingests all 20 docs into its own table under
# the `chunkshop_bakeoff_ntsb` schema, then ranks against the 12 hand-written
# gold queries in `gold-ntsb.yaml`. Results land in
# `skill-output/bakeoff/ntsb_bakeoff/` (results.json + report.md +
# recommended.yaml).
#
# Usage:
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5434/age_bakeoff_pgrg
#   chunkshop bakeoff --config docs/samples/bakeoff-ntsb/bakeoff-ntsb.yaml
#
# Matrix size: 4 chunkers x 3 embedders = 12 combos. Each combo writes a
# separate table named `<chunker>_<embedder_short>` inside the schema.
# `--keep-schema` preserves the tables for post-hoc psql inspection;
# default behavior drops the schema after the leaderboard is written.

name: ntsb_bakeoff

source:
  type: files
  glob: docs/samples/bakeoff-ntsb/corpus/*.md
  id_from: stem      # doc_id = file stem (e.g. "20080109X00035")

framer:
  type: identity

gold_queries: docs/samples/bakeoff-ntsb/gold-ntsb.yaml

matrix:
  embedders:
    - { type: fastembed, model_name: "Xenova/bge-small-en-v1.5-int8", dim: 384 }
    - { type: fastembed, model_name: "Xenova/bge-base-en-v1.5-int8",  dim: 768 }
    - { type: fastembed, model_name: "nomic-ai/nomic-embed-text-v1.5-Q", dim: 768 }
  chunkers:
    - { type: hierarchy }
    - { type: sentence_aware }
    - { type: fixed_overlap }
    - { type: neighbor_expand, base: { type: hierarchy }, window: 1 }

target:
  dsn_env: CHUNKSHOP_DSN
  schema: chunkshop_bakeoff_ntsb

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
