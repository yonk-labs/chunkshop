# Multi-backend bakeoff against the NTSB aviation-accident corpus shipped
# with pg-raggraph's kg-rag-eval benchmark (20 final-report markdown files).
#
# Each (backend × chunker × embedder) cell ingests all 20 docs into its own
# table; every cell is queried via its sink's native vector syntax. Results
# land in `skill-output/bakeoff/ntsb_bakeoff/` (results.json + report.md +
# recommended.yaml). The report shows accuracy + ingest/query latency
# side-by-side across backends.
#
# Usage:
#   export CHUNKSHOP_DSN=postgresql://postgres:postgres@localhost:5434/age_bakeoff_pgrg
#   export MARIADB_DSN=mysql://root:rootpw@localhost:3307/mysql
#   export SQLITE_BAKEOFF_PATH=/tmp/chunkshop-bakeoff-ntsb.db
#   chunkshop bakeoff --config docs/samples/bakeoff-ntsb/bakeoff-ntsb.yaml
#
# Matrix size: 7 chunkers × 3 embedders × 3 backends = 63 cells. The CLI
# does NOT clean up databases/schemas/files after the run — drop them
# yourself before re-running.

name: ntsb_bakeoff

source:
  type: files
  glob: docs/samples/bakeoff-ntsb/corpus/*.md
  id_from: stem      # doc_id = file stem (e.g. "20080109X00035")

framer:
  type: identity

gold_queries: docs/samples/bakeoff-ntsb/gold-ntsb.yaml

matrix:
  embedders:
    - { type: fastembed, model_name: "Xenova/bge-small-en-v1.5-int8", dim: 384 }
    - { type: fastembed, model_name: "Xenova/bge-base-en-v1.5-int8",  dim: 768 }
    - { type: fastembed, model_name: "nomic-ai/nomic-embed-text-v1.5-Q", dim: 768 }
  chunkers:
    - { type: hierarchy }
    - { type: sentence_aware }
    - { type: fixed_overlap }
    - { type: neighbor_expand, base: { type: hierarchy }, window: 1 }
    - { type: semantic, boundary_model: same }   # reuse main embedder; default int8 model has inhomogeneous-tensor tokenizer bug
    - type: summary_embed
      base: { type: hierarchy }
      summarizer:
        mode: callable
        module: chunkshop.summarizers.lede
        function: summarize
        kwargs: { max_length: 300 }
    - type: hierarchical_summary
      base: { type: hierarchy }
      summarizer:
        mode: callable
        module: chunkshop.summarizers.lede
        function: summarize
        kwargs: { max_length: 300 }

targets:
  - type: postgres
    dsn_env: CHUNKSHOP_DSN
    database: chunkshop_bakeoff_ntsb_pg
  - type: mariadb
    dsn_env: MARIADB_DSN
    database: chunkshop_bakeoff_ntsb_md
  - type: sqlite
    dsn_env: SQLITE_BAKEOFF_PATH
    database: ignored
  - type: clickhouse
    dsn_env: CLICKHOUSE_DSN
    database: chunkshop_bakeoff_ntsb_ch

scoring:
  k: [1, 3, 5]
  include_mrr: true
  top_k: 5
