[package]
name = "chunkshop-inline-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Path-depend on the local chunkshop-rs crate. In a downstream project you'd
# pin to a published version once chunkshop-rs is on crates.io.
chunkshop = { package = "chunkshop-rs", path = "../../../../rust/chunkshop" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
