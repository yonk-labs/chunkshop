# Hint-biased summary_embed (lede v0.4): static hints applied to every document.
# Requires the [lede] extra. See docs/quickstart-summaries.md.
cell_name: samples_summary_embed_hints
source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem
chunker:
  type: summary_embed
  base:
    type: hierarchy
  summarizer:
    mode: callable
    module: chunkshop.summarizers.lede
    function: summarize
    kwargs:
      max_length: 400
      hints: ["onboarding", "benefits"]   # list, or a {term: weight} map
      hint_focus: 0.7                      # 0=ignore .. 1=only hint pool
      hint_mode: soft                      # soft=bias ranking, hard=filter
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
target:
  type: postgres
  dsn_env: CHUNKSHOP_DSN
  database: chunkshop_samples
  table: summary_embed_hints_static
  mode: create_if_missing
  source_tag: hints_static
  hnsw: false
