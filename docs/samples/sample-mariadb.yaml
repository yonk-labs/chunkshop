# MariaDB end-to-end example. Requires MariaDB 11.7+ (native VECTOR type).
# docker-compose.test.yaml at the repo root provides one; otherwise see
# https://mariadb.com/kb/en/vector-overview/ for setup.
#
# From the chunkshop repo root:
#   export CHUNKSHOP_DSN=mysql://root:rootpw@localhost:3307/mysql
#   chunkshop ingest --config docs/samples/sample-mariadb.yaml
cell_name: samples_mariadb_demo

source:
  type: files
  glob: docs/samples/*-*.md
  id_from: stem
  encoding: utf-8

chunker:
  type: hierarchy
  prefix_heading: true
  min_section_chars: 100

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 4
  batch_size: 64

extractor:
  type: none

target:
  type: mariadb
  dsn_env: CHUNKSHOP_DSN
  database: chunkshop_samples
  table: handbook
  mode: overwrite
  source_tag: samples
  hnsw: true               # inline VECTOR INDEX in CREATE TABLE

runtime:
  omp_num_threads: 4
  heartbeat_every: 5
  log_path: /tmp/chunkshop-sample-mariadb.log
