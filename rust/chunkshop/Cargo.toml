[package]
name = "chunkshop-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Standalone ingest-to-pgvector: source -> chunker -> embedder -> extractor -> table. int8 BGE by default; bakeoff matrix evaluator built in. Cross-language wire-format compatible with the Python `chunkshop` package."
readme = "../README.md"
keywords = ["rag", "pgvector", "embeddings", "chunking", "fastembed"]
categories = ["database", "science", "text-processing"]

# Keep the published .crate tarball lean. Without these excludes, cargo
# bundles all the parity-test JSON references — useful for repo CI but
# noise for users who install the crate.
exclude = [
    "tests/parity-fixtures/*",
]

[lib]
name = "chunkshop"
path = "src/lib.rs"

[[bin]]
name = "chunkshop-rs"
path = "src/main.rs"
# The CLI consumes load_config + run_cell + run_bakeoff_with_base, which
# transitively need every module. Gating to `full` ensures the binary only
# builds when the consumer opted into the heavy dep stack.
required-features = ["full"]

[dependencies]
# --- Always-on core (small, used by the chunker module) ---
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "1"
tracing = "0.1"

# --- Bin-only (kept always-on for diff minimality; clap + tracing-subscriber
# are tiny relative to the heavy deps below) ---
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- `embedder` / `embedder-core` / `embedder-hub` features: ML inference stack ---
# fastembed is declared with `default-features = false` so its bundled
# `hf-hub-native-tls` feature does NOT pull `hf-hub` transitively. Consumers
# using `embedder-core` get fastembed's BYO (`try_new_from_user_defined`) path
# without `hf-hub` / `ureq` / native-tls deps. The `embedder-hub` feature
# re-enables fastembed's `hf-hub-native-tls` for the stock auto-download path.
fastembed = { version = "5.13.1", default-features = false, features = ["ort-download-binaries-native-tls", "image-models"], optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }
ndarray = { version = "0.17.2", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"], optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

# --- `extractor` feature ---
whatlang = { version = "0.16", optional = true }

# --- `source` feature: HTTP / S3 / glob ---
futures = { version = "0.3", optional = true }
glob = { version = "0.3", optional = true }
object_store = { version = "0.11", default-features = false, features = ["aws"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
sha1 = { version = "0.10", optional = true }

# --- `sink` feature: pgvector / sqlx ---
blake2 = { version = "0.10", default-features = false, optional = true }
pgvector = { version = "0.4", features = ["sqlx"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono"], optional = true }

# --- Shared runtime (gated by source + sink) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

# --- Optional callable summarizer integration ---
lede = { version = "0.3", optional = true }

[dev-dependencies]
# `no-env-filter` lets `#[traced_test]` capture warn! events from any crate,
# not just the test executable. Required to assert on tracing events emitted
# by `chunkshop::semantic` and `chunkshop::oversize` from inside integration
# tests.
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[features]
# Default = full feature set for backward compatibility. Existing consumers
# of `chunkshop = "0.3"` (and the `chunkshop-rs` binary) see no change.
default = ["full"]

# Everything — the historical compile target. Required by the CLI binary.
full = ["chunkers", "embedder", "extractor", "source", "sink", "pipeline", "bakeoff"]

# Just the chunker module + its config types and supporting modules
# (sentence_split, summarizer, the `Document` struct). Pulls only the
# small always-on core deps. The `SemanticChunker` requires `embedder-hub`
# (or `embedder`) in addition; without that feature the semantic chunker is
# excluded.
chunkers = []

# ML inference stack (fastembed + ORT). Required for `FastembedEmbedder`
# and the `SemanticChunker`'s boundary embedder.
#
# Split into two sub-features so external consumers (e.g. embedded library
# users that load model bytes from their own storage) can avoid pulling
# `hf-hub`, `ureq`, and the native-tls crypto stack:
#
# - `embedder-core` — fastembed (BYO/`try_new_from_user_defined`) + ort +
#   ndarray + tokenizers. NO hf-hub. NO auto-download. Caller supplies model
#   bytes directly via `FastembedEmbedder::from_user_defined_files`.
#
# - `embedder-hub` — adds `hf-hub` and re-enables fastembed's
#   `hf-hub-native-tls` for the stock auto-download path
#   (`FastembedEmbedder::new` + the bit-near-exact Xenova int8 BGE path).
#
# - `embedder` = `embedder-core` + `embedder-hub` — historical alias,
#   preserves the dep tree existing consumers see today.
embedder = ["embedder-core", "embedder-hub"]
embedder-core = ["dep:fastembed", "dep:ndarray", "dep:ort", "dep:tokenizers"]
embedder-hub = ["embedder-core", "dep:hf-hub", "fastembed/hf-hub-native-tls"]

# Language-detection extractor (whatlang).
extractor = ["dep:whatlang"]

# Source loaders: files (glob), HTTP, S3.
source = ["dep:futures", "dep:glob", "dep:object_store", "dep:reqwest", "dep:sha1", "dep:tokio"]

# pgvector sink.
sink = ["dep:blake2", "dep:pgvector", "dep:sqlx", "dep:tokio"]

# High-level Pipeline + run_cell glue. Composes chunker + embedder +
# extractor + source + sink.
pipeline = ["chunkers", "embedder", "extractor", "source", "sink"]

# Matrix evaluator (chunkers x embedders → leaderboard).
bakeoff = ["pipeline"]

# Enables the `chunkshop.summarizers.lede` callable summarizer module by
# pulling the `lede` crate from crates.io. Build with: cargo build --features lede
lede = ["dep:lede"]
