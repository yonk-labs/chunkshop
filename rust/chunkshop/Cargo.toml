[package]
name = "chunkshop-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Standalone ingest-to-pgvector: source -> chunker -> embedder -> extractor -> table. int8 BGE by default; bakeoff matrix evaluator built in. Cross-language wire-format compatible with the Python `chunkshop` package."
readme = "../README.md"
keywords = ["rag", "pgvector", "embeddings", "chunking", "fastembed"]
categories = ["database", "science", "text-processing"]

# Keep the published .crate tarball lean. Without these excludes, cargo
# bundles all the parity-test JSON references — useful for repo CI but
# noise for users who install the crate.
exclude = [
    "tests/parity-fixtures/*",
]

[lib]
name = "chunkshop"
path = "src/lib.rs"

[[bin]]
name = "chunkshop-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake2 = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive"] }
fastembed = "5"
glob = "0.3"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
ndarray = { version = "0.17.2", default-features = false }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
sha1 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "json", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
whatlang = "0.16"
object_store = { version = "0.11", default-features = false, features = ["aws"] }
futures = "0.3"
lede = { version = "0.3", optional = true }

[dev-dependencies]
# `no-env-filter` lets `#[traced_test]` capture warn! events from any crate,
# not just the test executable. Required to assert on tracing events emitted
# by `chunkshop::semantic` and `chunkshop::oversize` from inside integration
# tests.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tempfile = "3"

[features]
default = []
# Enables the `chunkshop.summarizers.lede` callable summarizer module by
# pulling the `lede` crate from crates.io. Build with: cargo build --features lede
lede = ["dep:lede"]
