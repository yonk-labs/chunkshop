# Scenario 03 — heading_boundary framer splits one file into 4 framed docs.
cell_name: sub_framer_heading

source:
  type: files
  glob: tests/sub/scenarios/03-framer-heading-boundary/data/*.md
  id_from: stem
  encoding: utf-8

framer:
  type: heading_boundary
  pattern: '^##\s'
  title_from_heading: true

chunker:
  type: hierarchy
  prefix_heading: true
  min_section_chars: 80

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  schema: chunkshop_sub_scenarios
  table: framer_heading
  mode: overwrite
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_03_framer_heading.log
