# Scenario 07 cell B — json_corpus source, append to the table created by cell A.
cell_name: sub_multi_b_api

source:
  type: json_corpus
  path: tests/sub/scenarios/07-multi-source-schema-flex/data/api_items.json
  documents_key: documents
  id_field: id
  content_field: content
  title_field: title

chunker:
  type: hierarchy
  prefix_heading: true
  min_section_chars: 60

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  schema: chunkshop_sub_scenarios
  table: unified_multi_source
  mode: append
  source_tag: api_items
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_07b_multi_api.log
