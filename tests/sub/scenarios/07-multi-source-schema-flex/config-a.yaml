# Scenario 07 cell A — markdown source, create_if_missing (first into the table).
cell_name: sub_multi_a_markdown

source:
  type: files
  glob: tests/sub/scenarios/07-multi-source-schema-flex/data/*.md
  id_from: stem
  encoding: utf-8

chunker:
  type: hierarchy
  prefix_heading: true
  min_section_chars: 100

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  type: postgres
  database: chunkshop_sub_scenarios
  table: unified_multi_source
  mode: create_if_missing
  source_tag: docs_markdown
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_07a_multi_markdown.log
