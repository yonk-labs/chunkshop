# Scenario 06 — hierarchy chunker splits oversized section using default max_chars.
# The single storage.md file has one H1 and ~10 KB of body prose with no sub-headings,
# forcing the chunker to fall through to its max_chars safety valve.
cell_name: sub_max_chars_split

source:
  type: files
  glob: tests/sub/scenarios/06-max-chars-oversized-sections/data/*.md
  id_from: stem
  encoding: utf-8

chunker:
  type: hierarchy
  prefix_heading: true
  min_section_chars: 100
  max_chars: 2000

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  schema: chunkshop_sub_scenarios
  table: max_chars_split
  mode: overwrite
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_06_max_chars_split.log
