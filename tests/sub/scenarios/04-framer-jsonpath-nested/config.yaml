# Scenario 04 — jsonpath framer walks a nested JSON file.
# files source reads the JSON file as a single raw Document; the framer parses
# the content and fans it out into 5 framed docs.
cell_name: sub_framer_jsonpath

source:
  type: files
  glob: tests/sub/scenarios/04-framer-jsonpath-nested/data/*.json
  id_from: stem
  encoding: utf-8

framer:
  type: jsonpath
  row_path: items.*
  title_path: title
  body_path: body

chunker:
  type: sentence_aware
  doc_type: prose
  max_chars: 400
  min_chars: 80

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  type: postgres
  database: chunkshop_sub_scenarios
  table: framer_jsonpath
  mode: overwrite
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_04_framer_jsonpath.log
