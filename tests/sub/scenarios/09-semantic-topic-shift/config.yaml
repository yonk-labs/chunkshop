cell_name: sub_semantic_topic_shift
source:
  type: files
  glob: tests/sub/scenarios/09-semantic-topic-shift/data/*.md
  id_from: stem
framer:
  type: identity
chunker:
  type: semantic
  boundary_model: sentence-transformers/all-MiniLM-L6-v2-int8
  breakpoint_percentile: 90
  min_sentences_per_chunk: 3
  max_chunk_chars: 2000
  sentence_splitter: naive
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
target:
  dsn_env: CHUNKSHOP_TEST_DSN
  type: postgres
  database: chunkshop_sub_scenarios
  table: semantic_topic_shift
  mode: overwrite
  hnsw: false
runtime:
  log_path: /tmp/chunkshop_sub_semantic_topic_shift.log
