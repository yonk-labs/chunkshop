cell_name: sub_hierarchical_fine_coarse
source:
  type: files
  glob: tests/sub/scenarios/11-hierarchical-fine-coarse/data/*.md
  id_from: stem
framer:
  type: identity
chunker:
  type: hierarchical_summary
  base:
    type: hierarchy
  grouping:
    strategy: section_aware
  summarizer:
    mode: passthrough
embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
target:
  dsn_env: CHUNKSHOP_TEST_DSN
  type: postgres
  database: chunkshop_sub_scenarios
  table: hierarchical_fine_coarse
  mode: overwrite
  hnsw: false
  promote_metadata:
    - {path: granularity, type: text}
    - {path: group_id, type: text}
runtime:
  log_path: /tmp/chunkshop_sub_hierarchical.log
