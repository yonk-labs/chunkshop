# Scenario 08 — neighbor_expand chunker wraps a sentence_aware base.
cell_name: sub_neighbor_expand

source:
  type: json_corpus
  path: tests/sub/scenarios/08-neighbor-expand-wrapper/data/paragraphs.json
  documents_key: documents
  id_field: id
  content_field: content
  title_field: title

chunker:
  type: neighbor_expand
  window: 1
  base:
    type: sentence_aware
    doc_type: prose
    max_chars: 300
    min_chars: 60

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  schema: chunkshop_sub_scenarios
  table: neighbor_expand
  mode: overwrite
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_sub_08_neighbor_expand.log
