# Scenario 02 — Legal clause review.
# json_corpus + sentence_aware + bge-base-int8 + composite(spacy + lang_detect) + promote_metadata.
# Quality-first pick: contracts are dense prose, miss-at-rank-1 wastes billable
# time. spaCy extracts ORG/PERSON/DATE/GPE per chunk; those land in jsonb
# metadata and get promoted so queries can filter `entities__org` via SQL at
# query time without re-running NER.
cell_name: usecase_legal_clause_review

source:
  type: json_corpus
  path: tests/use-cases/scenarios/02-legal-clause-review/data/contracts.json
  documents_key: documents
  id_field: id
  content_field: content
  title_field: title

chunker:
  type: sentence_aware
  doc_type: prose
  max_chars: 2000
  min_chars: 200

embedder:
  type: fastembed
  model_name: Xenova/bge-base-en-v1.5-int8
  dim: 768
  threads: 2
  batch_size: 32

extractor:
  type: composite
  extractors:
    - type: spacy_entities
      model: en_core_web_sm
      label_whitelist: ["ORG", "PERSON", "DATE", "GPE"]
    - type: lang_detect

target:
  dsn_env: CHUNKSHOP_TEST_DSN
  schema: chunkshop_use_cases
  table: legal_clause_review
  mode: overwrite
  source_tag: contracts_archive
  promote_metadata:
    - path: entities.ORG
      type: text[]
    - path: language
      type: text
  hnsw: false

runtime:
  omp_num_threads: 2
  heartbeat_every: 5
  log_path: /tmp/chunkshop_usecase_legal_clause_review.log
